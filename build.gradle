plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.142'

    id 'core'
    id 'net.darkhax.curseforgegradle' version '1.+'
    id 'com.modrinth.minotaur' version '2.8.7'
    id 'git-changelog'
}


println("Changelog: ${project.ext.mod_changelog}")
version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    exclusiveContent {
        forRepository {
            maven {
                url "https://cursemaven.com"
            }
        }
        filter {
            includeGroup "curse.maven"
        }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers.add('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // mostly optional in a single mod project
        // but multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main {
    java {
        // Mystical Extended Tier has not published a 26.1 build yet.
        exclude 'com/lucasmellof/mystical_missing_items/mods/extended_tier/**'
        exclude 'com/lucasmellof/mystical_missing_items/mixins/mods/extended_tier/**'
        exclude 'com/lucasmellof/mystical_missing_items/client/ClientStuff.java'
        exclude 'com/lucasmellof/mystical_missing_items/mods/agradditions/AgradditionsClient.java'
        exclude 'com/lucasmellof/mystical_missing_items/gen/ModRecipes.java'
        exclude 'com/lucasmellof/mystical_missing_items/events/ModEvent.java'
        exclude 'com/lucasmellof/mystical_missing_items/MysticalMissingItemsMixinPlugin.java'
    }
    resources {
        srcDir 'src/generated/resources'
        exclude '**/.cache/**'
        exclude 'data/**/advancement/**'
        exclude 'data/mysticalextendedtier/**'
        exclude 'data/mystical_missing_items/recipe/agradatitions_*.json'
        exclude 'data/mystical_missing_items/recipe/lightium_*.json'
        exclude 'data/mystical_missing_items/recipe/ornium_*.json'
        exclude 'data/mystical_missing_items/recipe/ouranium_*.json'
        exclude 'data/mystical_missing_items/recipe/tornium_*.json'
    }
}


dependencies {
    implementation "curse.maven:cucumber-272335:8433624"
    implementation "curse.maven:mystical-agriculture-tiered-crystals-299045:8219089"
    implementation "curse.maven:mystical-agriculture-246640:8344253"
    implementation "curse.maven:mystical-agradditions-256247:8344258"
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}



task publishCurseForge(type: net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    dependsOn(tasks.jar)
    apiToken = secrets.curseforgeKey
    def mainFile = upload(curseforge_project_id, jar)
    mainFile.releaseType = "release"
    mainFile.changelogType = "text"
    mainFile.changelog = rootProject.ext.mod_changelog
    mainFile.addJavaVersion("Java ${project.java_version}")
    mainFile.addGameVersion(minecraft_version)
    mainFile.addModLoader("NeoForge")

    mainFile.addRequirement("cucumber")
    mainFile.addRequirement("mystical-agriculture")
    mainFile.addRequirement("mystical-agradditions")
    mainFile.addRelation("mystical-agriculture-tiered-crystals", "optionalDependency")
}

modrinth {
    token = secrets.modrinthKey
    projectId = "${modrinth_project_id}"
    versionNumber = project.minecraft_version + '-' + project.version
    versionName = "${project.version} for NeoForge ${project.minecraft_version}"
    versionType = "release"
    uploadFile = jar
    gameVersions = [ project.minecraft_version ]
    changelog = provider { rootProject.ext.mod_changelog }
    loaders = ["neoforge"]

    dependencies {
        required.project "cucumber"
        required.project "mystical-agriculture"
        required.project "mystical-agradditions"
    }
}
